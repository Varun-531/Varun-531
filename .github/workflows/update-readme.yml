name: Update README

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:         # Manual trigger option

permissions:
  contents: write  # 👈 Gives permission to push changes

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update timestamp in file
        run: |
          echo "Last updated on: $(date '+%Y-%m-%d %H:%M:%S')" > update-time.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Commit and push if there are changes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          git diff --cached --quiet && echo "✅ No changes to commit" || (
            git commit -m "🔄 Auto-update: $(date '+%Y-%m-%d %H:%M:%S')"
            git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }} HEAD:main
          )
